[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.36"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
fs_permissions = [{ access = "read", path = "./" }]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 48
fail_on_revert = false
